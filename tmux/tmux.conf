# Requires tmux >= 3.3; designed for current Homebrew / modern Linux.
set -g prefix C-a
unbind C-b
bind C-a send-prefix
bind a send-prefix
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm-ghostty:RGB,xterm-256color:RGB'
# Applications may send OSC 52 through tmux to the attached terminal.
set -g set-clipboard on
# No unrestricted DCS passthrough: OSC 52 works through set-clipboard.
set -g allow-passthrough off
set -g detach-on-destroy on
set -g destroy-unattached off
set -g exit-unattached off
setw -g mode-keys vi
setw -g automatic-rename on
setw -g allow-rename off
set -g display-time 2000
set -g repeat-time 500
set -g status-interval 5
set -g update-environment 'DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_TTY WINDOWID XAUTHORITY'

bind c new-window -c '#{pane_current_path}'
bind '|' split-window -h -c '#{pane_current_path}'
bind '-' split-window -v -c '#{pane_current_path}'
unbind '"'
unbind '%'
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind -r p previous-window
bind -r n next-window
bind Tab last-window
bind r source-file ~/.tmux.conf \; display-message 'tmux configuration reloaded'
bind C-l send-keys C-l
bind f send-keys C-f
bind g display-popup -E -w 95% -h 95% -d '#{pane_current_path}' 'lazygit'
bind -n C-f display-popup -E -w 85% -h 75% '$HOME/.local/bin/tmux-sessionizer'

# Navigation: native tmux bindings + the Neovim navigator plugin, NOT a TPM duplicate.
# fzf must receive C-j/C-k itself. ssh/mosh forward navigation to the remote host.
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf|ssh|mosh)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R
# Guaranteed outer-pane navigation, even when a pane is running SSH.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Nested tmux: F12 disables this session's root bindings and prefix until F12 again.
# This is session-scoped: other clients attached to THIS session are affected.
bind -T root F12 set prefix None \; set key-table passthrough \; set status-style 'bg=#303030,fg=#ffaf00' \; refresh-client -S
bind -T passthrough F12 set prefix C-a \; set key-table root \; set status-style 'bg=#262626,fg=#bcbcbc' \; refresh-client -S

# Copy: vi selection, tmux buffer, OSC 52; local Mac also writes pbcopy directly.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
if-shell 'test "$(uname -s)" = Darwin && command -v pbcopy >/dev/null' {
  bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel pbcopy
  bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel pbcopy
}

set -g status-position bottom
set -g status-style 'bg=#262626,fg=#bcbcbc'
set -g status-left-length 55
set -g status-right-length 70
set -g status-left '#[fg=#87afff,bold] #S #[default]'
set -g status-right '#{?client_prefix,#[fg=#ffaf00]PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#808080]#h %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#ffffff,bg=#444444,bold] #I:#W #[default]'
set -g pane-border-style 'fg=#444444'
set -g pane-active-border-style 'fg=#87afff'
set -g message-style 'bg=#444444,fg=#ffffff'

# Recover layout/cwd only. Never replay infrastructure commands automatically.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-processes 'false'
set -g @resurrect-capture-pane-contents 'off'
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'
# No launch agent: restore when YOU start tmux after login/reboot.
set -g @continuum-boot 'off'
# Optional private per-host settings; continuum must be loaded last.
if-shell 'test -f ~/.config/tmux/local.conf' 'source-file ~/.config/tmux/local.conf'
if-shell 'test -f ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
